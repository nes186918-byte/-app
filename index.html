<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>卡了电竞</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <style>
        html { background: transparent; height: 100%; }
        body { background: transparent; color: #fff; font-family: sans-serif; padding: 15px; margin: 0; min-height: 100vh; position: relative; z-index: 1; }
        #snow { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }

        .box { background: rgba(0,0,0,0.55); backdrop-filter: blur(4px); padding: 15px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.65); margin-bottom: 15px; position: relative; z-index: 1; }
        h2 { color: #ffffff; text-align: center; margin: 0 0 15px 0; font-size: 1.2em; }
        input, select { width: 100%; padding: 12px; margin-top: 10px; border-radius: 5px; border: 1px solid #555; background: rgba(20,20,30,0.85); color: #fff; font-size: 16px; box-sizing: border-box; }
        button { background: #ffffff; color: #000; font-weight: bold; cursor: pointer; width: 100%; padding: 12px; margin-top: 10px; border-radius: 5px; border: 1px solid #fff; font-size: 16px; box-sizing: border-box; }
        button:active { background: #ccc; }
        .link { text-align: center; margin-top: 15px; color: #aaa; }
        .link span { color: #fff; cursor: pointer; text-decoration: underline; }
        #msg { text-align: center; margin-top: 15px; padding: 12px 24px; border-radius: 8px; display: none; position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 1000; min-width: 200px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }

        .order-btn { margin-top: 8px; padding: 8px 10px; font-size: 13px; width: auto; margin-right: 8px; display: inline-block; border: 1px solid rgba(255,255,255,0.4); }
        .btn-green { background: #00ff88; color: #000; border: none; }
        .btn-red { background: #ff4757; color: #fff; border: none; }
        .btn-purple { background: #ff00ff; color: #fff; border: none; }
        .btn-orange { background: #ffa502; color: #000; border: none; }
        #detailModal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); padding: 15px; box-sizing: border-box; z-index: 999; overflow-y: auto; }
        #detailModal .box { margin-top: 30px; border-color: rgba(255,255,255,0.8); }
        .footer-bar { position: fixed; bottom: 0; left: 0; width: 100%; background: rgba(10,10,20,0.9); padding: 10px; display: none; justify-content: space-between; align-items: center; box-sizing: border-box; border-top: 1px solid rgba(255,255,255,0.5); z-index: 50; }
        .footer-bar button { width: auto; padding: 8px 15px; margin: 0; }
        .loading-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 9999; justify-content: center; align-items: center; }
        .loading-spinner { width: 50px; height: 50px; border: 5px solid #fff; border-top: 5px solid transparent; border-radius: 50%; animation: spin 1s linear infinite; }

        #chatWindow { position: fixed; right: 20px; bottom: 160px; width: 350px; height: 450px; background: rgba(15,10,20,0.95); border-radius: 12px; border: 1px solid rgba(255,255,255,0.5); z-index: 1001; display: none; flex-direction: column; overflow: hidden; }

        #privatePanel { position: fixed; left: 20px; bottom: 160px; width: 400px; height: 520px; background: rgba(15,10,20,0.95); border-radius: 12px; border: 1px solid rgba(255,255,255,0.5); z-index: 1001; display: none; flex-direction: column; overflow: hidden; }
        #privatePanelHeader { padding: 10px; background: rgba(255,255,255,0.1); color: #fff; font-weight: bold; text-align: center; border-bottom: 1px solid rgba(255,255,255,0.3); flex-shrink: 0; }

        .online-user-item { display: flex; align-items: center; padding: 8px; cursor: pointer; border-radius: 5px; margin-bottom: 5px; }
        .online-user-item:hover { background: rgba(255,255,255,0.1); }

        .online-user-item.self-item:hover { background: transparent; }
        .status-dot { width: 10px; height: 10px; border-radius: 50%; margin-right: 8px; flex-shrink: 0; }

        .username-text { font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #fff; }
        .role-tag { font-size: 10px; padding: 1px 4px; border-radius: 3px; margin-left: 5px; flex-shrink: 0; }
        .role-tag.owner { background: #ff00ff; color: #fff; }
        .role-tag.admin { background: #ff69b4; color: #fff; }
        .role-tag.worker { background: #00f0ff; color: #000; }
        .role-tag.player { background: #00ff88; color: #000; }
        .unread-badge { background: #ff4757; color: #fff; font-size: 10px; padding: 1px 6px; border-radius: 10px; margin-left: auto; flex-shrink: 0; }
        .user-section-label { font-size: 11px; color: #888; padding: 6px 4px 2px; }
        .chat-msg { max-width: 85%; padding: 8px 12px; border-radius: 8px; word-break: break-all; }
        .chat-msg.self { align-self: flex-end; }
        .chat-msg.other { align-self: flex-start; }
        .chat-msg.owner { background: rgba(255,0,255,0.2); border-left: 3px solid #ff00ff; }
        .chat-msg.admin { background: rgba(255,105,180,0.2); border-left: 3px solid #ff69b4; }
        .chat-msg.worker { background: rgba(0,240,255,0.2); border-left: 3px solid #00f0ff; }
        .chat-msg.player { background: rgba(0,255,136,0.2); border-left: 3px solid #00ff88; }
        .chat-nickname { font-size: 12px; color: #aaa; margin-bottom: 4px; }
        .chat-content { font-size: 14px; color: #fff; }
        .chat-time { font-size: 11px; color: #666; text-align: right; margin-top: 4px; }
        .private-chat-window { width: 100%; height: 100%; background: transparent; border-radius: 0; border: none; display: flex; flex-direction: column; overflow: hidden; }
        .private-chat-header { padding: 10px; background: rgba(255,255,255,0.1); color: #fff; font-weight: bold; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.3); flex-shrink: 0; font-size: 14px; }
        .private-chat-back { background: none; border: none; color: #fff; font-size: 18px; cursor: pointer; width: auto; margin: 0; padding: 0 6px; }
        .private-chat-close { background: none; border: none; color: #fff; font-size: 18px; cursor: pointer; width: auto; margin: 0; padding: 0 6px; }
        .private-chat-messages { flex: 1; padding: 10px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
        .private-chat-input-area { padding: 8px; border-top: 1px solid #333; display: flex; gap: 6px; flex-shrink: 0; }
        .private-chat-input { flex: 1; padding: 6px; margin: 0; font-size: 13px; border-radius: 5px; border: 1px solid #333; background: #111; color: #fff; }
        .private-chat-send { width: auto; padding: 6px 10px; margin: 0; font-size: 13px; background: #fff; color: #000; border: none; font-weight: bold; cursor: pointer; border-radius: 5px; }
    </style>
</head>
<body>
    <canvas id="snow"></canvas>

    <div id="fatalError"></div>

    <div id="auth">
        <div class="box">

            <input id="chatInput" placeholder="输入消息..." onkeypress="if(event.key==='Enter')window.sendChatMessage()">

        <div id="privatePanelHeader">私聊</div>
        <div id="userListHeader">全部用户</div>
        <div id="userList"></div>
        <div id="privateChatContainer"></div>

<script>
/*渲染雪花帧逻辑函数*/
(function snowNightBg(){
    const canvas = document.getElementById('snow');
    const ctx = canvas.getContext('2d');
    let bgGradient = null; let flakes = [];
    function resize(){ canvas.width=window.innerWidth; canvas.height=window.innerHeight; bgGradient=ctx.createLinearGradient(0,0,0,canvas.height); bgGradient.addColorStop(0,'#0a0e27'); bgGradient.addColorStop(0.5,'#0d1535'); bgGradient.addColorStop(1,'#050b1e'); }
    window.addEventListener('resize', resize); resize();
    const TARGET_STEP=1000/120;
    function buildSnowPath(){const p=new Path2D();for(let i=0;i<6;i++){const a=(Math.PI/3)*i,cos=Math.cos(a),sin=Math.sin(a);p.moveTo(0,0);p.lineTo(cos,sin);const tipX=cos,tipY=sin,forkLen=0.35,fa1=a+0.7,fa2=a-0.7;p.moveTo(tipX,tipY);p.lineTo(tipX+Math.cos(fa1)*forkLen,tipY+Math.sin(fa1)*forkLen);p.moveTo(tipX,tipY);p.lineTo(tipX+Math.cos(fa2)*forkLen,tipY+Math.sin(fa2)*forkLen);const mx=cos*0.55,my=sin*0.55,ma1=a+0.9,ma2=a-0.9;p.moveTo(mx,my);p.lineTo(mx+Math.cos(ma1)*0.25,my+Math.sin(ma1)*0.25);p.moveTo(mx,my);p.lineTo(mx+Math.cos(ma2)*0.25,my+Math.sin(ma2)*0.25);}return p;}
    const SNOW_PATH=buildSnowPath();
    class Snowflake{constructor(){this.reset(true);}reset(init){this.x=Math.random()*canvas.width;this.y=init?Math.random()*canvas.height:-20;this.size=Math.random()*2.8+2.2;this.baseSpeedY=Math.random()*0.35+0.18;this.baseSpeedX=(Math.random()-0.5)*0.08;this.alpha=Math.random()*0.45+0.35;this.angle=Math.random()*Math.PI*2;this.spin=(Math.random()-0.5)*0.015;this.swing=Math.random()*0.005+0.003;this.phase=Math.random()*Math.PI*2;this.wind=Math.random()*0.18+0.04;}update(dtScale){this.y+=this.baseSpeedY*dtScale;this.x+=(Math.sin(this.y*this.swing+this.phase)*this.wind+this.baseSpeedX)*dtScale;this.angle+=this.spin*dtScale;if(this.y>canvas.height+25||this.x<-30||this.x>canvas.width+30){this.reset(false);this.y=-20;this.x=Math.random()*canvas.width;}}draw(){ctx.save();ctx.translate(this.x,this.y);ctx.rotate(this.angle);ctx.scale(this.size,this.size);ctx.globalAlpha=this.alpha;ctx.strokeStyle='rgba(190,215,255,1)';ctx.lineWidth=0.35;ctx.lineCap='round';ctx.stroke(SNOW_PATH);ctx.restore();}}
    for(let i=0;i<200;i++) flakes.push(new Snowflake());
    let lastTime=performance.now(),acc=0;
    function loop(now){let ft=now-lastTime;if(ft>250)ft=250;lastTime=now;acc+=ft;while(acc>=TARGET_STEP){flakes.forEach(f=>f.update(TARGET_STEP/16.6667));acc-=TARGET_STEP;}ctx.fillStyle=bgGradient;ctx.fillRect(0,0,canvas.width,canvas.height);flakes.forEach(f=>f.draw());requestAnimationFrame(loop);}
    requestAnimationFrame(loop);
})();

/* ========== 核心配置 ========== */
function bjTime(isoStr){if(!isoStr)return'';var m=isoStr.match(/[T\s](\d{2}):(\d{2}):\d{2}/);if(!m)return isoStr;var h=parseInt(m[1],10),min=m[2];h=(h+8)%24;return(h<10?'0'+h:''+h)+':'+min;}
const SUPABASE_URL='https://wjrkygyfciazaiwdgbfy.supabase.co';
const SUPABASE_ANON_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Indqcmt5Z3lmY2lhemFpd2RnYmZ5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQwODIwNjEsImV4cCI6MjA5OTY1ODA2MX0.LX4A8vKu5IOzHfU-YcWG8Hlgi7kSG0cMQENKDV5uIzI';

const roleNameMap={owner:'店长',admin:'管理员',worker:'打手',player:'玩家'};
const roleColorMap={owner:'#ff00ff',admin:'#ff69b4',worker:'#00f0ff',player:'#00ff88'};
const workStatusMap={online:'在线',resting:'休息中'};
const workStatusColorMap={online:'#00ff88',resting:'#ffa502'};

window.supabaseClient=null;window.currentUser=null;window.userProfile=null;
window.senderMap={};window.workerMap={};window.currentChatRoomId=null;
window.chatSubscription=null;window.lastSendTime=0;window.presenceChannel=null;
window.onlineUsersCache={};window.privateChatSubscriptions={};
window.autoCancelTimer=null;window.cancelPollingTimer=null;
window.allProfilesCache=[];window.myPrivateRooms=[];window.unreadMap={};window.globalPrivateSubscriptions={};
window.profileChangeSubscription=null;

function init(){if(typeof window.supabase==='undefined'){showFatalError('无法加载系统组件');return;}try{window.supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);autoLogin();}catch(e){showFatalError('系统初始化失败：'+e.message);}}
function showFatalError(msg){document.getElementById('fatalError').style.display='block';document.getElementById('fatalError').textContent='❌ '+msg;}
window.showMessage=function(t,s){const el=document.getElementById('msg');el.textContent=t;el.style.background=s?'rgba(0,255,136,0.9)':'rgba(255,0,85,0.9)';el.style.display='block';setTimeout(()=>el.style.display='none',3000);};
window.toggleLoading=s=>document.getElementById('loadingOverlay').style.display=s?'flex':'none';

window.setView=v=>{
    document.getElementById('auth').style.display=v==='auth'?'block':'none';
    document.getElementById('app').style.display=v==='app'?'block':'none';
    document.getElementById('footerBar').style.display=v==='app'?'flex':'none';
    document.getElementById('chatToggleBtn').style.display=v==='app'?'block':'none';
    document.getElementById('privateChatToggleBtn').style.display=v==='app'?'block':'none';
    if(v==='auth'){document.getElementById('chatWindow').style.display='none';document.getElementById('privatePanel').style.display='none';}
};
window.mapStatus=s=>({pending:'待接单',accepted:'已接单',completed:'已完成',cancelled:'已取消',cancelling:'取消审批中'}[s]||'未知');

/* ========== 管理面板 Tab ========== */
window.renderManageTabs=function(){
    const isOwner=window.userProfile.role==='owner';
    const t=document.getElementById('manageTabs');t.innerHTML='';
    if(isOwner){
        t.innerHTML+=`<button id="tabAudit" class="tab-btn-active" onclick="window.switchManageTab('audit')">待审管理员</button>`;
        t.innerHTML+=`<button id="tabRest" onclick="window.switchManageTab('rest')">休息审批 <span id="restBadge" style="color:#ff4757;"></span></button>`;
    }
    t.innerHTML+=`<button id="tabCancel" class="${isOwner?'':'tab-btn-active'}" onclick="window.switchManageTab('cancel')">订单取消申请 <span id="cancelBadge" style="color:#ff4757;"></span></button>`;
    document.getElementById('auditList').style.display=isOwner?'block':'none';
    document.getElementById('restList').style.display='none';
    document.getElementById('cancelList').style.display=isOwner?'none':'block';
    if(isOwner)window.loadAuditList();
    window.loadCancelRequests();
    if(isOwner)window.loadRestRequests();
};
window.switchManageTab=function(tab){
    const io=window.userProfile.role==='owner';
    if(io){
        document.getElementById('tabAudit').classList.toggle('tab-btn-active',tab==='audit');
        document.getElementById('auditList').style.display=tab==='audit'?'block':'none';
        document.getElementById('tabRest').classList.toggle('tab-btn-active',tab==='rest');
        document.getElementById('restList').style.display=tab==='rest'?'block':'none';
    }
    document.getElementById('tabCancel').classList.toggle('tab-btn-active',tab==='cancel');
    document.getElementById('cancelList').style.display=tab==='cancel'?'block':'none';
    if(tab==='cancel')window.loadCancelRequests();
    if(tab==='rest')window.loadRestRequests();
};

/* ========== UI 更新 ========== */
window.updateUI=function(){
    let workStatusHtml='';
    if(window.userProfile.role==='owner'){
        const currentStatus=window.userProfile.work_status||'online';
        const btnText=currentStatus==='online'?'切换为休息':'切换为上线';
        workStatusHtml=` <button onclick="window.toggleWorkStatus()" style="margin-top:5px;padding:5px 10px;font-size:12px;width:auto;display:inline-block;">${btnText}</button>`;
    } else if(['worker','admin'].includes(window.userProfile.role)){
        const currentStatus=window.userProfile.work_status||'online';
        if(currentStatus==='online'){
            workStatusHtml=` <button onclick="window.requestRest()" style="margin-top:5px;padding:5px 10px;font-size:12px;width:auto;display:inline-block;">申请下线休息</button>`;
        } else {
            workStatusHtml=` <span style="color:#ffa502;font-size:12px;">(休息中)</span>`;
        }
    }
    document.getElementById('userInfo').innerHTML=`欢迎: ${window.userProfile.nickname}（${roleNameMap[window.userProfile.role]||window.userProfile.role}）${workStatusHtml}`;
    document.getElementById('footerUser').textContent=window.userProfile.nickname;
    document.getElementById('orderPanel').style.display=(['owner','player','admin'].includes(window.userProfile.role))?'block':'none';
    const im=['owner','admin'].includes(window.userProfile.role);
    document.getElementById('ownerPanel').style.display=im?'block':'none';
    if(im){window.renderManageTabs();window.startCancelPolling();}
};

/* ========== 工作状态切换/申请 ========== */
window.toggleWorkStatus=async function(){
    const newStatus=(window.userProfile.work_status||'online')==='online'?'resting':'online';
    await window.supabaseClient.from('profiles').update({work_status:newStatus}).eq('id',window.currentUser.id);
    window.userProfile.work_status=newStatus;
    window.showMessage(`已切换为${workStatusMap[newStatus]}`,true);
    window.updateUI();
    if(window.presenceChannel) await window.presenceChannel.track({id:window.currentUser.id,nickname:window.userProfile.nickname,role:window.userProfile.role,work_status:newStatus,online_at:new Date().toISOString()});
};
window.requestRest=async function(){
    const reason=prompt('申请休息原因（可选）：')||'无';
    try{await window.supabaseClient.from('rest_requests').insert({user_id:window.currentUser.id,reason:reason,status:'pending'});window.showMessage('申请已提交，等待店长审批',true);}catch(e){window.showMessage('申请失败',false);}
};

/* ========== 休息审批 ========== */
window.loadRestRequests=async function(silent=false){
    if(window.userProfile.role!=='owner')return;
    const{data:reqs}=await window.supabaseClient.from('rest_requests').select('*').eq('status','pending').order('created_at',{ascending:false});
    const bd=document.getElementById('restBadge');if(bd)bd.textContent=reqs?.length?`(${reqs.length})`:'';
    const el=document.getElementById('restList');if(!el||(silent&&el.style.display==='none'))return;
    if(!reqs?.length){el.innerHTML='<div style="color:#aaa;">暂无休息申请</div>';return;}
    const uids=[...new Set(reqs.map(r=>r.user_id))],{data:us}=await window.supabaseClient.from('profiles').select('id,nickname,role').in('id',uids);
    const um=Object.fromEntries(us?.map(u=>[u.id,u])||[]);
    el.innerHTML=reqs.map(r=>{const u=um[r.user_id]||{};return`<div class="order" style="border-left-color:#ffa502;"><div><b>申请者:</b> ${u.nickname||'未知'}（${roleNameMap[u.role]||u.role||''}）</div><div><b>原因:</b> ${r.reason}</div><button class="order-btn btn-green" onclick="window.approveRest('${r.id}','${r.user_id}')">批准</button><button class="order-btn btn-red" onclick="window.rejectRest('${r.id}')">驳回</button></div>`;}).join('');
};
window.approveRest=async function(rid,uid){if(!confirm('批准休息？'))return;await window.supabaseClient.from('profiles').update({work_status:'resting'}).eq('id',uid);await window.supabaseClient.from('rest_requests').update({status:'approved'}).eq('id',rid);window.showMessage('已批准休息',true);window.loadRestRequests();window.loadAllProfiles();};
window.rejectRest=async function(rid){if(!confirm('驳回？'))return;await window.supabaseClient.from('rest_requests').update({status:'rejected'}).eq('id',rid);window.showMessage('已驳回',true);window.loadRestRequests();};

/* ========== 登录/注册 ========== */
window.autoLogin=async function(){const{data:{session}}=await window.supabaseClient.auth.getSession();if(!session){window.setView('auth');return;}let{data:p}=await window.supabaseClient.from('profiles').select('*').eq('id',session.user.id).maybeSingle();if(!p){const m=session.user.user_metadata||{};let role=m.role||'player',st='approved';if(role==='owner'){const{data:o}=await window.supabaseClient.from('profiles').select('id').eq('role','owner').eq('status','approved');if(o?.length){window.setView('auth');return;}}else if(role==='admin')st='pending';const{data:np}=await window.supabaseClient.from('profiles').insert({id:session.user.id,email:session.user.email,nickname:m.nickname||session.user.email.split('@')[0],role,status:st}).select().single();if(!np){window.setView('auth');return;}p=np;}if(p.status!=='approved'){window.setView('auth');return;}window.currentUser=session.user;await window.supabaseClient.from('profiles').update({work_status:'online'}).eq('id',session.user.id);p.work_status='online';window.userProfile=p;window.updateUI();window.setView('app');window.loadOrders();window.initChat();window.trackOnlineStatus();window.loadAllProfiles();window.subscribeProfileChanges();window.startAutoCancelChecker();window.showMessage(`欢迎 ${p.nickname}`,true);};
window.handleLogin=async function(){const e=document.getElementById('email').value.trim(),pw=document.getElementById('pass').value.trim();if(!e||!pw){window.showMessage('请输入邮箱和密码',false);return;}window.toggleLoading(true);try{const{data,error}=await window.supabaseClient.auth.signInWithPassword({email:e,password:pw});if(error){window.showMessage(error.message,false);return;}let{data:p}=await window.supabaseClient.from('profiles').select('*').eq('id',data.user.id).maybeSingle();if(!p){const m=data.user.user_metadata||{};let role=m.role||'player',st='approved';if(role==='owner'){const{data:o}=await window.supabaseClient.from('profiles').select('id').eq('role','owner').eq('status','approved');if(o?.length){window.showMessage('店长账号已存在',false);return;}}else if(role==='admin')st='pending';const{data:np}=await window.supabaseClient.from('profiles').insert({id:data.user.id,email:data.user.email,nickname:m.nickname||e.split('@')[0],role,status:st}).select().single();if(!np){window.showMessage('创建资料失败',false);return;}p=np;}if(p&&p.status!=='approved'){window.showMessage('账号审核中',false);return;}window.currentUser=data.user;await window.supabaseClient.from('profiles').update({work_status:'online'}).eq('id',data.user.id);p.work_status='online';window.userProfile=p;window.updateUI();window.setView('app');window.loadOrders();window.initChat();window.trackOnlineStatus();window.loadAllProfiles();window.subscribeProfileChanges();window.startAutoCancelChecker();window.showMessage(`欢迎 ${p.nickname}`,true);document.getElementById('pass').value='';}catch(e){window.showMessage(e.message,false);}finally{window.toggleLoading(false);}};
window.handleRegister=async function(){const e=document.getElementById('regEmail').value.trim(),p=document.getElementById('regPass').value.trim(),n=document.getElementById('regName').value.trim(),r=document.getElementById('regRole').value;if(!e||!p||!n){window.showMessage('请填写完整信息',false);return;}if(r==='owner'){const{data:o}=await window.supabaseClient.from('profiles').select('id').eq('role','owner');if(o?.length){window.showMessage('店长账号已存在',false);return;}}window.toggleLoading(true);try{const{error}=await window.supabaseClient.auth.signUp({email:e,password:p,options:{data:{nickname:n,role:r}}});if(error){window.showMessage(error.message,false);return;}window.showMessage(r==='admin'?'注册成功请等待店长审核':'注册成功请登录',true);window.showLogin();document.getElementById('email').value=e;}catch(e){window.showMessage(e.message,false);}finally{window.toggleLoading(false);}};
window.startAutoCancelChecker=function(){if(window.autoCancelTimer)clearInterval(window.autoCancelTimer);window.autoCancelTimer=setInterval(async()=>{if(!window.currentUser)return;const now=new Date().toISOString();const{data:ex}=await window.supabaseClient.from('orders').select('id').eq('status','pending').not('auto_cancel_at','is',null).lt('auto_cancel_at',now);if(ex?.length){await window.supabaseClient.from('orders').delete().in('id',ex.map(o=>o.id));window.loadOrders();}},30000);};
window.startCancelPolling=function(){if(window.cancelPollingTimer)clearInterval(window.cancelPollingTimer);window.cancelPollingTimer=setInterval(()=>{if(!window.currentUser||!['owner','admin'].includes(window.userProfile?.role))return;window.loadCancelRequests(true);},8000);};
window.createOrder=async function(){const c=document.getElementById('orderContent').value.trim(),g=document.getElementById('orderGameId').value.trim(),p=document.getElementById('orderPrice').value.trim(),cat=document.getElementById('orderCategory').value;if(!c||!g||!p){window.showMessage('请填写完整订单信息',false);return;}try{const exp=new Date(Date.now()+15*60000).toISOString();await window.supabaseClient.from('orders').insert({sender_id:window.currentUser.id,content:c,game_id:g,price:parseFloat(p),status:'pending',category:cat,auto_cancel_at:exp});window.showMessage('订单发布成功（15分钟无人接单自动取消）',true);document.getElementById('orderContent').value='';document.getElementById('orderGameId').value='';document.getElementById('orderPrice').value='';window.loadOrders();}catch(e){window.showMessage(e.message,false);}};
window.loadOrders=async function(){if(!window.currentUser||!window.userProfile)return;let q=window.supabaseClient.from('orders').select('*').order('created_at',{ascending:false});if(window.userProfile.role==='owner'||window.userProfile.role==='admin'){}else if(window.userProfile.role==='worker')q=q.or(`worker_id.eq.${window.currentUser.id},and(status.eq.pending)`);else q=q.or(`sender_id.eq.${window.currentUser.id},worker_id.eq.${window.currentUser.id}`);const{data:orders,error}=await q;if(error){window.showMessage(error.message,false);return;}const el=document.getElementById('orderList');if(!orders?.length){el.innerHTML='<div style="text-align:center;color:#aaa;padding:20px;">暂无订单</div>';return;}const sIds=[...new Set(orders.map(o=>o.sender_id))],{data:sds}=await window.supabaseClient.from('profiles').select('id,nickname').in('id',sIds);window.senderMap=Object.fromEntries(sds?.map(s=>[s.id,s.nickname])||[]);const wIds=[...new Set(orders.map(o=>o.worker_id).filter(Boolean))],{data:wds}=await window.supabaseClient.from('profiles').select('id,nickname').in('id',wIds);window.workerMap=Object.fromEntries(wds?.map(w=>[w.id,w.nickname])||[]);el.innerHTML=orders.map(o=>{const io=o.sender_id===window.currentUser.id,iw=o.worker_id===window.currentUser.id;const ct=['owner','admin','worker'].includes(window.userProfile.role)&&o.status==='pending'&&!o.worker_id&&!io;const cc=iw&&o.status==='accepted';const cd=(io&&o.status==='pending')||(iw&&o.status==='accepted');const crq=io&&o.status==='accepted';const ctg=o.category?`<span class="category-tag">${o.category}</span>`:'';let cdn='';if(o.status==='pending'&&o.auto_cancel_at){const r=new Date(o.auto_cancel_at)-new Date();if(r>0){cdn=`<div class="countdown">⏰ ${Math.floor(r/60000)}分${Math.floor((r%60000)/1000)}秒后自动取消</div>`;}}return`<div class="order"><div><b>内容:</b> ${o.content} ${ctg}</div><div><b>游戏ID:</b> ${o.game_id}</div><div><b>状态:</b> <span style="color:#fff;">${window.mapStatus(o.status)}</span></div>${cdn}<div><b>发单:</b> ${window.senderMap[o.sender_id]||'未知'}</div><div><b>接单:</b> ${o.worker_id?(window.workerMap[o.worker_id]||'无'):'无'}</div><button class="order-btn" onclick="window.showOrderDetail('${o.id}')">详情</button>${ct?`<button class="order-btn" onclick="window.takeOrder('${o.id}')">接单</button>`:''}${cc?`<button class="order-btn btn-green" onclick="window.completeOrder('${o.id}')">结单</button>`:''}${cd?`<button class="order-btn btn-red" onclick="window.deleteOrder('${o.id}')">取消</button>`:''}${crq?`<button class="order-btn btn-orange" onclick="window.requestCancelOrder('${o.id}')">申请取消</button>`:''}</div>`;}).join('');};
window.takeOrder=async function(id){if(!window.currentUser?.id){window.handleLogout();return;}const{data,error}=await window.supabaseClient.from('orders').update({worker_id:window.currentUser.id,status:'accepted'}).eq('id',id).eq('status','pending').is('worker_id',null).select();if(error){window.showMessage(error.message,false);return;}if(!data?.length){window.showMessage('订单已被接走',false);window.loadOrders();return;}window.showMessage('接单成功',true);window.loadOrders();};
window.completeOrder=async function(id){if(!confirm('确认完成订单？'))return;await window.supabaseClient.from('orders').update({status:'completed'}).eq('id',id).eq('worker_id',window.currentUser.id).eq('status','accepted');window.showMessage('已结单',true);window.loadOrders();window.closeDetailModal();};
window.deleteOrder=async function(id){if(!confirm('确认取消？'))return;await window.supabaseClient.from('orders').delete().eq('id',id);window.showMessage('已取消',true);window.loadOrders();window.closeDetailModal();};
window.requestCancelOrder=async function(id){const r=prompt('取消原因（发给店长/管理员）：');if(r===null)return;try{const{data:c}=await window.supabaseClient.from('orders').select('id,status,sender_id').eq('id',id).maybeSingle();if(!c){window.showMessage('订单不存在',false);return;}if(c.sender_id!==window.currentUser.id){window.showMessage('只能取消自己的订单',false);return;}if(c.status!=='accepted'){window.showMessage('当前状态为'+window.mapStatus(c.status),false);return;}const{u}=await window.supabaseClient.from('orders').update({status:'cancelling'}).eq('id',id).eq('sender_id',window.currentUser.id).select('id').maybeSingle();if(!u){window.showMessage('修改失败，请确认RLS已关闭',false);return;}const oid=typeof id==='string'&&!isNaN(id)?Number(id):id;const ie=await window.supabaseClient.from('cancel_requests').insert({order_id:oid,requester_id:window.currentUser.id,reason:r||'无',status:'pending'});if(ie.error){await window.supabaseClient.from('orders').update({status:'accepted'}).eq('id',id);window.showMessage(ie.error.message,false);return;}window.showMessage('申请已提交，管理员将实时收到',true);window.loadOrders();}catch(e){window.showMessage(e.message,false);}};
window.loadCancelRequests=async function(silent=false){if(!['owner','admin'].includes(window.userProfile?.role))return;const{data:reqs}=await window.supabaseClient.from('cancel_requests').select('*').eq('status','pending').order('created_at',{ascending:false});const bd=document.getElementById('cancelBadge');if(bd)bd.textContent=reqs?.length?`(${reqs.length})`:'';const el=document.getElementById('cancelList');if(!el||(silent&&el.style.display==='none'))return;if(!reqs?.length){el.innerHTML='<div style="color:#aaa;">暂无取消申请</div>';return;}const oids=[...new Set(reqs.map(r=>r.order_id))],{data:ors}=await window.supabaseClient.from('orders').select('id,content,game_id').in('id',oids);const om=Object.fromEntries(ors?.map(o=>[o.id,o])||[]);const uids=[...new Set(reqs.map(r=>r.requester_id).filter(Boolean))],{data:us}=await window.supabaseClient.from('profiles').select('id,nickname').in('id',uids);const um=Object.fromEntries(us?.map(u=>[u.id,u.nickname])||[]);el.innerHTML=reqs.map(r=>`<div class="order" style="border-left-color:#ffa502;"><div><b>申请者:</b> ${um[r.requester_id]||'未知'}</div><div><b>内容:</b> ${om[r.order_id]?.content||'<span style="color:#888;">订单已删除</span>'}</div><div><b>游戏ID:</b> ${om[r.order_id]?.game_id||'-'}</div><div><b>原因:</b> ${r.reason}</div><button class="order-btn btn-green" onclick="window.approveCancel('${r.id}',${r.order_id})">同意取消</button><button class="order-btn btn-red" onclick="window.reject('${r.id}',${r.order_id})">驳回</button></div>`).join('');};
window.approveCancel=async function(rid,oid){if(!confirm('同意取消？订单将彻底删除。'))return;await window.supabaseClient.from('orders').delete().eq('id',Number(oid));await window.supabaseClient.from('cancel_requests').update({status:'approved'}).eq('id',rid);window.showMessage('已取消并移除',true);window.loadCancelRequests();window.loadOrders();};
window.rejectCancel=async function(rid,oid){if(!confirm('驳回？订单恢复已接单'))return;await window.supabaseClient.from('orders').update({status:'accepted'}).eq('id',Number(oid));await window.supabaseClient.from('cancel_requests').update({status:'rejected'}).eq('id',rid);window.showMessage('已驳回',true);window.loadCancelRequests();if(window.loadOrders)window.loadOrders();};window.reject=window.rejectCancel;
window.showOrderDetail=async function(id){const{data:o}=await window.supabaseClient.from('orders').select('*').eq('id',id).single();const io=o.sender_id===window.currentUser.id,iw=o.worker_id===window.currentUser.id,cd=(io&&o.status==='pending')||(iw&&o.status==='accepted'),crq=io&&o.status==='accepted',ctg=o.category?`<span class="category-tag">${o.category}</span>`:'';document.getElementById('detailContent').innerHTML=`<div><b>分类:</b> ${o.category||'无'}</div><div><b>内容:</b> ${o.content} ${ctg}</div><div><b>游戏ID:</b> ${o.game_id}</div><div><b>价格:</b> ¥${o.price}</div><div><b>状态:</b> ${window.mapStatus(o.status)}</div><div><b>发单:</b> ${window.senderMap?.[o.sender_id]||'未知'}</div><div><b>接单:</b> ${o.worker_id?(window.workerMap?.[o.worker_id]||'无'):'无'}</div>${cd?'<button class="order-btn btn-red" onclick="window.deleteOrder(\''+o.id+'\')">取消</button>':''}${crq?'<button class="order-btn btn-orange" onclick="window.requestCancelOrder(\''+o.id+'\')">申请取消</button>':''}`;document.getElementById('detailModal').style.display='block';};
window.closeDetailModal=()=>document.getElementById('detailModal').style.display='none';
window.loadAuditList=async function(){if(window.userProfile.role!=='owner')return;const{data:a}=await window.supabaseClient.from('profiles').select('*').eq('role','admin').eq('status','pending').order('created_at',{ascending:false});const el=document.getElementById('auditList');if(!a?.length){el.innerHTML='<div style="color:#aaa;">暂无待审核</div>';return;}el.innerHTML=a.map(x=>`<div class="order"><div><b>${x.nickname}</b>(${x.email})</div><button class="order-btn btn-purple" onclick="window.approveAdmin('${x.id}')">批准</button></div>`).join('');};
window.approveAdmin=async function(id){if(!confirm('批准？'))return;await window.supabaseClient.from('profiles').update({status:'approved'}).eq('id',id);window.showMessage('批准成功',true);window.loadAuditList();};
window.handleLogout=async function(){if(window.presenceChannel)window.supabaseClient.removeChannel(window.presenceChannel);if(window.chatSubscription)window.supabaseClient.removeChannel(window.chatSubscription);if(window.profileChangeSubscription)window.supabaseClient.removeChannel(window.profileChangeSubscription);Object.values(window.globalPrivateSubscriptions).forEach(s=>window.supabaseClient.removeChannel(s));Object.values(window.privateChatSubscriptions).forEach(s=>window.supabaseClient.removeChannel(s));window.globalPrivateSubscriptions={};window.privateChatSubscriptions={};if(window.autoCancelTimer)clearInterval(window.autoCancelTimer);if(window.cancelPollingTimer)clearInterval(window.cancelPollingTimer);await window.supabaseClient.auth.signOut();window.currentUser=null;window.userProfile=null;window.setView('auth');window.showMessage('已退出',true);};
window.showReg=()=>document.getElementById('regBox').style.display='block';window.showLogin=()=>document.getElementById('regBox').style.display='none';

/* ========== 在线状态 ========== */
window.trackOnlineStatus=async function(){window.presenceChannel=window.supabaseClient.channel('online-users');window.presenceChannel.on('presence',{event:'sync'},()=>{const s=window.presenceChannel.presenceState();window.onlineUsersCache={};Object.keys(s).forEach(k=>{const u=s[k][0];if(u)window.onlineUsersCache[u.id]=u;});window.renderUserList();}).on('presence',{event:'join'},({newPresences})=>{newPresences.forEach(p=>{if(p.id)window.onlineUsersCache[p.id]=p;});window.renderUserList();}).on('presence',{event:'leave'},({left})=>{left.forEach(p=>{if(p.id)delete window.onlineUsersCache[p.id];});window.renderUserList();}).subscribe(async(s)=>{if(s==='SUBSCRIBED')await window.presenceChannel.track({id:window.currentUser.id,nickname:window.userProfile.nickname,role:window.userProfile.role,work_status:window.userProfile.work_status||'online',online_at:new Date().toISOString()});});};

/* ========== 🔧 修复后的用户列表（核心修改） ========== */
window.loadAllProfiles=async function(){const{data}=await window.supabaseClient.from('profiles').select('id,nickname,role,work_status').eq('status','approved').neq('id',window.currentUser.id);window.allProfilesCache=data||[];window.renderUserList();window.loadMyPrivateRoomsAndUnread();};

window.renderUserList=function(){
    const c=document.getElementById('userList');
    const meId=window.currentUser.id;

    // 从 DB 缓存里取自己的工作状态
    const meWs=window.userProfile.work_status||'online';
    const meRole=window.userProfile.role;

    // 在线 ID 集合（只看 Presence 心跳，不关心 Presence 里的 work_status）
    const onlineIdSet=new Set(Object.keys(window.onlineUsersCache));

    // 分类
    const onlineActive=[], onlineResting=[], offlineList=[];
    window.allProfilesCache.forEach(u=>{
        const ws=u.work_status||'online';
        if(onlineIdSet.has(u.id)){
            if(ws==='resting') onlineResting.push(u);
            else onlineActive.push(u);
        } else {
            offlineList.push(u);
        }
    });

    // 统计：真正"在线且非休息"的人数
    let trulyOnlineCount=0;
    Object.keys(window.onlineUsersCache).forEach(id=>{
        const u=window.onlineUsersCache[id];
        if(u.work_status!=='resting') trulyOnlineCount++;
    });
    if(!onlineIdSet.has(meId) && meWs==='online'){
        trulyOnlineCount++;
    }
    const total=window.allProfilesCache.length+1;
    document.getElementById('userListHeader').textContent=`全部用户 (在线${trulyOnlineCount}/${total})`;

    let html='';

    // 🟢 在线区（在线 + 非休息）
    if(onlineActive.length>0 || (onlineIdSet.has(meId) && meWs==='online')){
        html+='<div class="user-section-label">🟢 在线</div>';
        if(onlineIdSet.has(meId) && meWs==='online'){
            html+=`<div class="online-user-item self-item"><div class="status-dot online"></div><div class="username-text">${window.userProfile.nickname}（我）</div><span class="role-tag ${meRole}" style="background:${roleColorMap[meRole]||'#888'}">${roleNameMap[meRole]||meRole}</span><span class="role-tag" style="background:${workStatusColorMap[meWs]}">${workStatusMap[meWs]}</span></div>`;
        }
        onlineActive.sort((a,b)=>a.nickname.localeCompare(b.nickname)).forEach(u=>{
            const unread=window.unreadMap[u.id]||0;
            html+=`<div class="online-user-item" onclick="window.openPrivateChat('${u.id}','${u.nickname}','${u.role}')"><div class="status-dot online"></div><div class="username-text">${u.nickname}</div><span class="role-tag ${u.role}" style="background:${roleColorMap[u.role]||'#888'}">${roleNameMap[u.role]||u.role}</span><span class="role-tag" style="background:${workStatusColorMap.online}">在线</span>${unread?`<span class="unread-badge">${unread}</span>`:''}</div>`;
        });
    }

    // 🟡 休息中区（在线 + 休息 或 自己休息）
    if(onlineResting.length>0 || (onlineIdSet.has(meId) && meWs==='resting')){
        html+='<div class="user-section-label">🟡 休息中</div>';
        if(onlineIdSet.has(meId) && meWs==='resting'){
            html+=`<div class="online-user-item self-item"><div class="status-dot resting"></div><div class="username-text">${window.userProfile.nickname}（我）</div><span class="role-tag ${meRole}" style="background:${roleColorMap[meRole]||'#888'}">${roleNameMap[meRole]||meRole}</span><span class="role-tag" style="background:${workStatusColorMap.resting}">休息中</span></div>`;
        }
        onlineResting.sort((a,b)=>a.nickname.localeCompare(b.nickname)).forEach(u=>{
            const unread=window.unreadMap[u.id]||0;
            html+=`<div class="online-user-item" onclick="window.openPrivateChat('${u.id}','${u.nickname}','${u.role}')"><div class="status-dot resting"></div><div class="username-text">${u.nickname}</div><span class="role-tag ${u.role}" style="background:${roleColorMap[u.role]||'#888'}">${roleNameMap[u.role]||u.role}</span><span class="role-tag" style="background:${workStatusColorMap.resting}">休息中</span>${unread?`<span class="unread-badge">${unread}</span>`:''}</div>`;
        });
    }

    // ⚪ 离线区 —— 已移除工作状态标签（不再显示"在线"）
    if(offlineList.length>0){
        html+='<div class="user-section-label">⚪ 离线</div>';
        offlineList.sort((a,b)=>a.nickname.localeCompare(b.nickname)).forEach(u=>{
            const unread=window.unreadMap[u.id]||0;
            html+=`<div class="online-user-item" onclick="window.openPrivateChat('${u.id}','${u.nickname}','${u.role}')"><div class="status-dot offline"></div><div class="username-text">${u.nickname}</div><span class="role-tag ${u.role}" style="background:${roleColorMap[u.role]||'#888'}">${roleNameMap[u.role]||u.role}</span>${unread?`<span class="unread-badge">${unread}</span>`:''}</div>`;
        });
    }

    c.innerHTML=html;
};

/* ========== 🔧 新增：监听 profiles 表变化（店长批准后实时生效） ========== */
window.subscribeProfileChanges=function(){
    if(window.profileChangeSubscription) return;
    const meId=window.currentUser.id;
    window.profileChangeSubscription=window.supabaseClient.channel('profile_changes')
        .on('postgres_changes',{event:'UPDATE',schema:'public',table:'profiles',filter:`id=eq.${meId}`},payload=>{
            const newWs=payload.new.work_status;
            if(newWs && newWs!==window.userProfile.work_status){
                window.userProfile.work_status=newWs;
                window.showMessage(`状态已更新为：${workStatusMap[newWs]||newWs}`,true);
                window.updateUI();
                if(window.presenceChannel) window.presenceChannel.track({id:meId,nickname:window.userProfile.nickname,role:window.userProfile.role,work_status:newWs,online_at:new Date().toISOString()});
                window.renderUserList();
            }
        })
        .subscribe();
};

/* ========== 未读红点 ========== */
function pvReadKey(roomId){return 'pv_read_'+roomId;}
window.getPeerIdFromRoom=room=>{if(!room.participants)return null;return room.participants.find(id=>id!==window.currentUser.id);};
window.loadMyPrivateRoomsAndUnread=async function(){
    const me=window.currentUser.id;
    const{data:rooms}=await window.supabaseClient.from('chat_rooms').select('id,participants').eq('room_type','private').contains('participants',[me]);
    window.myPrivateRooms=rooms||[];window.unreadMap={};
    for(const room of window.myPrivateRooms){const readTs=localStorage.getItem(pvReadKey(room.id))||'1970-01-01';const{data:msgs}=await window.supabaseClient.from('chat_messages').select('sender_id').eq('room_id',room.id).neq('sender_id',me).gt('created_at',readTs).limit(1);if(msgs?.length){const peer=window.getPeerIdFromRoom(room);if(peer)window.unreadMap[peer]=(window.unreadMap[peer]||0)+1;}}
    window.renderUserList();window.subscribeAllMyPrivateRooms();
};
window.subscribeAllMyPrivateRooms=function(){const me=window.currentUser.id;window.myPrivateRooms.forEach(room=>{if(window.globalPrivateSubscriptions[room.id])return;const ch=window.supabaseClient.channel(`global_pm_${room.id.replace(/-/g,'_')}`).on('postgres_changes',{event:'INSERT',schema:'public',table:'chat_messages',filter:`room_id=eq.${room.id}`},p=>{if(p.new.sender_id===me)return;const peer=window.getPeerIdFromRoom(room);if(!peer)return;const container=document.getElementById('privateChatContainer');const activeWin=container.querySelector('.private-chat-window');if(activeWin&&activeWin.dataset.roomId===room.id)return;window.unreadMap[peer]=(window.unreadMap[peer]||0)+1;window.renderUserList();}).subscribe();window.globalPrivateSubscriptions[room.id]=ch;});};
window.clearUnreadForPeer=(peerId,roomId)=>{window.unreadMap[peerId]=0;localStorage.setItem(pvReadKey(roomId),new Date().toISOString());window.renderUserList();};

/* ========== 私聊 ========== */
window.togglePrivatePanel=function(){const p=document.getElementById('privatePanel');if(p.style.display==='flex'){p.style.display='none';document.getElementById('privateChatContainer').style.display='none';}else{p.style.display='flex';document.getElementById('privateChatContainer').style.display='none';document.getElementById('userListHeader').style.display='block';document.getElementById('userList').style.display='block';window.renderUserList();}};
window.openPrivateChat=async function(tid,tn,tr){if(tid===window.currentUser.id)return;const sk=[window.currentUser.id,tid].sort(),ck=sk.join('_');const container=document.getElementById('privateChatContainer');document.getElementById('userListHeader').style.display='none';document.getElementById('userList').style.display='none';container.style.display='flex';const ex=container.querySelector(`.private-chat-window[data-chat-key="${ck}"]`);if(ex){ex.style.display='flex';container.querySelectorAll('.private-chat-window').forEach(w=>{if(w!==ex)w.style.display='none';});return;}container.querySelectorAll('.private-chat-window').forEach(w=>w.style.display='none');let rid=null;const v=window.myPrivateRooms.filter(r=>r.participants?.length===2&&r.participants.includes(sk[0])&&r.participants.includes(sk[1]));if(v.length){rid=v[0].id;}else{try{const{data:nr}=await window.supabaseClient.from('chat_rooms').insert({room_type:'private',participants:sk}).select().single();rid=nr.id;window.myPrivateRooms.push({id:rid,participants:sk});}catch(e){window.showMessage('私聊创建失败',false);return;}}const w=document.createElement('div');w.className='private-chat-window';w.style.display='flex';w.dataset.chatKey=ck;w.dataset.roomId=rid;w.dataset.peerId=tid;const tagName=roleNameMap[tr]||tr;w.innerHTML=`<div class="private-chat-header"><button class="private-chat-back" onclick="window.backToUserList()">←</button><span style="flex:1;text-align:center;">${tn}（${tagName}）</span><button class="private-chat-close" onclick="window.closePrivateChat('${ck}')">×</button></div><div class="private-chat-messages"></div><div class="private-chat-input-area"><input class="private-chat-input" placeholder="输入消息..." onkeypress="if(event.key==='Enter')window.sendPrivateMessage('${ck}')"><button class="private-chat-send" onclick="window.sendPrivateMessage('${ck}')">发送</button></div>`;container.appendChild(w);window.clearUnreadForPeer(tid,rid);window.loadPrivateMessages(ck,rid);window.subscribePrivateChat(ck,rid);w.querySelector('.private-chat-input').focus();};
window.backToUserList=function(){document.getElementById('privateChatContainer').style.display='none';document.getElementById('privateChatContainer').innerHTML='';document.getElementById('userListHeader').style.display='block';document.getElementById('userList').style.display='block';};
window.loadPrivateMessages=async function(k,r){const w=document.querySelector(`.private-chat-window[data-chat-key="${k}"]`);if(!w)return;const c=w.querySelector('.private-chat-messages');const{data}=await window.supabaseClient.from('chat_messages').select('*,sender:sender_id(nickname,role)').eq('room_id',r).eq('is_deleted',false).order('created_at',{ascending:false}).limit(50);c.innerHTML='';data?.reverse().forEach(m=>window.appendPrivateMessage(c,m));c.scrollTop=c.scrollHeight;};
window.appendPrivateMessage=(c,m)=>{const is=m.sender_id===window.currentUser?.id,role=m.sender?.role||'player',el=document.createElement('div');el.className=`chat-msg ${role} ${is?'self':'other'}`;el.innerHTML=`<div class="chat-nickname">${m.sender?.nickname||'未知'}</div><div class="chat-content">${m.content.replace(/</g,'&lt;')}</div><div class="chat-time">${bjTime(m.created_at)}</div>`;c.appendChild(el);c.scrollTop=c.scrollHeight;};
window.subscribePrivateChat=(k,r)=>{if(window.privateChatSubscriptions[r])return;const ch=window.supabaseClient.channel(`pm_open_${r.replace(/-/g,'_')}`).on('postgres_changes',{event:'INSERT',schema:'public',table:'chat_messages',filter:`room_id=eq.${r}`},p=>{const w=document.querySelector(`.private-chat-window[data-chat-key="${k}"]`);if(w)window.appendPrivateMessage(w.querySelector('.private-chat-messages'),p.new);}).subscribe();window.privateChatSubscriptions[r]=ch;};
window.sendPrivateMessage=async function(k){const w=document.querySelector(`.private-chat-window[data-chat-key="${k}"]`);if(!w)return;const i=w.querySelector('.private-chat-input'),t=i.value.trim();if(!t)return;if(Date.now()-window.lastSendTime<5000){window.showMessage('5秒后再发',false);return;}window.lastSendTime=Date.now();try{await window.supabaseClient.from('chat_messages').insert({room_id:w.dataset.roomId,sender_id:window.currentUser.id,content:t});i.value='';}catch(e){window.showMessage('发送失败',false);window.lastSendTime=0;}};
window.closePrivateChat=function(k){const w=document.querySelector(`.private-chat-window[data-chat-key="${k}"]`);if(w){if(window.privateChatSubscriptions[k]){window.supabaseClient.removeChannel(window.privateChatSubscriptions[k]);delete window.privateChatSubscriptions[k];}w.remove();if(!document.querySelector('.private-chat-window'))window.backToUserList();}};

/* ========== 公聊 ========== */
window.initChat=async function(){if(!window.currentUser)return;try{if(window.chatSubscription){window.supabaseClient.removeChannel(window.chatSubscription);window.chatSubscription=null;}let{data:rm}=await window.supabaseClient.from('chat_rooms').select('id').eq('room_type','public').single();if(!rm){const{data:nr}=await window.supabaseClient.from('chat_rooms').insert({room_type:'public'}).select().single();rm=nr;}window.currentChatRoomId=rm.id;await window.loadPublicMessages();const sid=rm.id.replace(/-/g,'_');window.chatSubscription=window.supabaseClient.channel(`public_chat_${sid}`).on('postgres_changes',{event:'INSERT',schema:'public',table:'chat_messages',filter:`room_id=eq.${rm.id}`},p=>window.appendPublicMessage(p.new)).subscribe();}catch(e){console.error(e);}};
window.loadPublicMessages=async function(){if(!window.currentChatRoomId)return;const{data}=await window.supabaseClient.from('chat_messages').select('*,sender:sender_id(nickname,role)').eq('room_id',window.currentChatRoomId).eq('is_deleted',false).order('created_at',{ascending:false}).limit(50);const c=document.getElementById('chatMessages');c.innerHTML='';data?.reverse().forEach(m=>window.appendPublicMessage(m));c.scrollTop=c.scrollHeight;};
window.appendPublicMessage=function(m){const c=document.getElementById('chatMessages'),is=m.sender_id===window.currentUser?.id,role=m.sender?.role||'player',el=document.createElement('div');el.className=`chat-msg ${role} ${is?'self':'other'}`;el.innerHTML=`<div class="chat-nickname">${m.sender?.nickname||'未知'}</div><div class="chat-content">${m.content.replace(/</g,'&lt;')}</div><div class="chat-time">${bjTime(m.created_at)}</div>`;c.appendChild(el);c.scrollTop=c.scrollHeight;};
window.sendChatMessage=async function(){const i=document.getElementById('chatInput'),t=i.value.trim();if(!t)return;if(Date.now()-window.lastSendTime<5000){window.showMessage('5秒后再发',false);return;}window.lastSendTime=Date.now();try{await window.supabaseClient.from('chat_messages').insert({room_id:window.currentChatRoomId,sender_id:window.currentUser.id,content:t});i.value='';}catch(e){window.showMessage('发送失败',false);window.lastSendTime=0;}};
window.toggleChat=function(){const w=document.getElementById('chatWindow');w.style.display=w.style.display==='flex'?'none':'flex';if(w.style.display==='flex'){document.getElementById('chatInput').focus();window.loadPublicMessages();}};

init();
</script>
