<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>验证成功 - 卡了电竞</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(135deg, #0a0e27, #0d1535, #050b1e);
            color: #fff;
            font-family: sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .card {
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255,255,255,0.3);
            border-radius: 16px;
            padding: 40px;
            text-align: center;
            max-width: 400px;
            width: 100%;
        }
        .icon { font-size: 64px; margin-bottom: 16px; }
        h1 { color: #00ff88; font-size: 1.5em; margin-bottom: 12px; }
        p { color: #ccc; font-size: 14px; line-height: 1.6; margin-bottom: 24px; }
        .btn {
            display: inline-block;
            background: #00ff88;
            color: #000;
            font-weight: bold;
            padding: 12px 32px;
            border-radius: 8px;
            text-decoration: none;
            font-size: 16px;
            cursor: pointer;
            border: none;
        }
        .btn:hover { background: #00cc6a; }
        .hint { margin-top: 16px; font-size: 12px; color: #666; }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon">✅</div>
        <h1>邮箱验证成功！</h1>
        <p>你的账号已经激活，现在可以使用「卡了电竞」的全部功能了。</p>
        <a class="btn" href="./index.html">前往登录</a>
        <p class="hint">如果按钮没反应，请手动回到登录页面</p>
    </div>
</body>
</html>
